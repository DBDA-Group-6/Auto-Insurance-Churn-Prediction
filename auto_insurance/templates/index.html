<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto Insurance ML - CSV Upload</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #262d56 0%, #8010b4 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        padding: 40px;
        max-width: 550px;
        width: 100%;
      }

      h2 {
        color: #333;
        text-align: center;
        margin-bottom: 10px;
        font-size: 28px;
      }

      .subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 30px;
        font-size: 14px;
      }

      .upload-section {
        margin-bottom: 20px;
      }

      label {
        display: block;
        color: #555;
        font-weight: 600;
        margin-bottom: 8px;
        font-size: 14px;
      }

      .file-input-wrapper {
        position: relative;
        overflow: hidden;
        display: inline-block;
        width: 100%;
        margin-bottom: 15px;
      }

      .file-input-wrapper input[type="file"] {
        position: absolute;
        left: -9999px;
      }

      .file-input-label {
        display: block;
        padding: 15px 20px;
        background: #f8f9fa;
        border: 2px dashed #ccc;
        border-radius: 10px;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s ease;
        color: #666;
      }

      .file-input-label:hover {
        background: #e9ecef;
        border-color: #667eea;
      }

      .file-input-label.has-file {
        background: #e7f3ff;
        border-color: #667eea;
        color: #333;
      }

      .file-name {
        font-size: 12px;
        color: #667eea;
        margin-top: 5px;
        font-weight: 600;
      }

      button[type="submit"] {
        width: 100%;
        padding: 15px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
        margin-top: 20px;
      }

      button[type="submit"]:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
      }

      button[type="submit"]:active {
        transform: translateY(0);
      }

      button[type="submit"]:disabled {
        background: #ccc;
        cursor: not-allowed;
        transform: none;
      }

      .info-box {
        background: #fff3cd;
        border-left: 4px solid #ffc107;
        padding: 12px;
        margin-bottom: 20px;
        border-radius: 5px;
        font-size: 13px;
        color: #856404;
      }

      @media (max-width: 600px) {
        .container {
          padding: 30px 20px;
        }

        h2 {
          font-size: 24px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Auto Insurance Churn Predictor</h2>
      <p class="subtitle">Upload your CSV file for prediction</p>

      <div class="info-box">
        Upload the raw data CSV file. It will be preprocessed and passed
        through the model automatically.
      </div>

      <form
        action="/upload"
        method="post"
        enctype="multipart/form-data"
        id="uploadForm"
      >
        <div class="upload-section">
          <label for="csv1">Raw Data CSV</label>
          <div class="file-input-wrapper">
            <input type="file" name="csv1" id="csv1" accept=".csv" required />
            <label for="csv1" class="file-input-label" id="label1">
              <span>📁 Choose raw data file...</span>
              <div class="file-name" id="filename1"></div>
            </label>
          </div>
        </div>

        <button type="submit" id="submitBtn">Submit for Prediction</button>
      </form>
    </div>

    <script>
      // Handle file input display
      document.getElementById("csv1").addEventListener("change", function (e) {
        const fileName = e.target.files[0]?.name;
        const label = document.getElementById("label1");
        const fileNameDiv = document.getElementById("filename1");

        if (fileName) {
          label.classList.add("has-file");
          fileNameDiv.textContent = "✔ " + fileName;
        }
      });

      // Handle form submission
      document
        .getElementById("uploadForm")
        .addEventListener("submit", function (e) {
          const submitBtn = document.getElementById("submitBtn");
          submitBtn.disabled = true;
          submitBtn.textContent = "Uploading...";
        });
    </script>
  </body>
</html>
